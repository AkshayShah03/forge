name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AZURE_RESOURCE_GROUP: multiagent-prod-rg
  ACR_NAME:             multiagentprodacr
  CONTAINER_APP_ENV:    multiagent-prod-env
  AZURE_LOCATION:       eastus2

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-azure.txt pytest pytest-asyncio

      - name: Run unit tests (no cloud dependencies)
        run: pytest tests/unit/ -v --timeout=30
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agents

  # ── Build and push images ─────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        id: meta
        run: echo "tags=${{ env.ACR_NAME }}.azurecr.io/multi-agent:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/multi-agent-api:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/multi-agent-api:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/multi-agent-api:latest
          cache-to:   type=inline

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            COMMAND=python -m worker.servicebus_worker
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/multi-agent-worker:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/multi-agent-worker:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/multi-agent-worker:latest
          cache-to:   type=inline

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name multiagent-prod-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/multi-agent-api:${{ github.sha }} \
            --set-env-vars DEPLOYMENT_SHA=${{ github.sha }}

      - name: Deploy Worker Container App
        run: |
          az containerapp update \
            --name multiagent-prod-worker \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/multi-agent-worker:${{ github.sha }} \
            --set-env-vars DEPLOYMENT_SHA=${{ github.sha }}

      - name: Verify deployment health
        run: |
          sleep 30
          API_URL=$(az containerapp show \
            --name multiagent-prod-api \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f "https://$API_URL/health" || exit 1
          echo "Deployment verified at https://$API_URL"
